micronaut:
  application:
    name: onboardingPlatform

  security:
    enabled: false

datasources:
  default:
    dialect: H2
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: validate

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true
      locations:
        - classpath:db/migration/h2

jwt:
  secret: "test-secret-key"
  expiration: 3600