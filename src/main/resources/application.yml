micronaut:
  application:
    name: onboardingPlatform

  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3000
          allowed-methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allowed-headers:
            - Content-Type
            - Authorization
          exposed-headers:
            - Authorization
          max-age: 3600

  security:
    enabled: false

  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

jwt:
  secret: 93018656fd37f313f740da85f2c29f4e4d076e1a267b6e4a86c8e27381c85a40
  expiration: 3600

openapi:
  enabled: true

swagger-ui:
  enabled: true
  oauth2RedirectUrl: /swagger-ui/oauth2-redirect.html

test-resources:
  enabled: false

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/onboarding_db
    driverClassName: org.postgresql.Driver
    username: onboarding_app
    password: onboarding_app
    dialect: POSTGRES

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: validate
        show_sql: false
        format_sql: true
        use_sql_comments: true

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true
      locations:
        - classpath:db/migration/postgres

jackson:
  serialization:
    indent-output: true
  deserialization:
    fail-on-unknown-properties: false
  serialization-inclusion: non_null

logging:
  levels:
    com.example.onboarding: DEBUG
    io.micronaut.data.query: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
